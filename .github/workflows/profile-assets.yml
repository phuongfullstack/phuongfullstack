name: Profile assets

# Builds every data-driven image in the README and publishes them to the
# `output` branch. Generating them here rather than embedding a third-party
# service means nothing outside this repository can break the profile.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Colours mirror assets/tokens.json: neutral empty cells ramping up to
      # the accent purple.
      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23A78BFA&color_dots=%2316161D,%232E1F52,%234B2FA0,%237C56E8,%23A78BFA

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stats, languages and activity cards
        run: python assets/stats.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
