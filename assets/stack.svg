    <text class="mono lbl fai" x="64" y="236">DATA</text>
    <text class="sans mut" x="274" y="238" font-size="17" font-weight="400">SQL Server  ·  PostgreSQL  ·  MongoDB  ·  Cosmos DB  ·  Redis</text>
    <line class="hair" x1="64" y1="264" x2="1216" y2="264"/>
    <text class="mono lbl fai" x="64" y="298">CLOUD &amp; OPS</text>
    <text class="sans mut" x="274" y="300" font-size="17" font-weight="400">Azure  ·  AWS  ·  Docker  ·  Terraform  ·  GitHub Actions  ·  RabbitMQ</text>
