    <line x1="488" y1="218" x2="488" y2="244" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrowA)" marker-start="url(#arrowA)"/>
    <text x="56" y="362" font-family="JetBrains Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="11.5" font-weight="600" fill="#6E6E80" letter-spacing="2.6">DELIVERY</text>
    <g><rect x="56.0" y="394" width="357.3333333333333" height="64" rx="10" fill="#16161D" stroke="#3A3A47" stroke-opacity="1" stroke-width="1"/><text x="235" y="423.0" text-anchor="middle" font-family="Inter,Segoe UI,-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#ECECF1">GitHub Actions</text><text x="235" y="442.0" text-anchor="middle" font-family="JetBrains Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="10.5" fill="#6E6E80" letter-spacing="0.6">build · test · scan</text></g>
    <g><rect x="461.3333333333333" y="394" width="357.3333333333333" height="64" rx="10" fill="#16161D" stroke="#3A3A47" stroke-opacity="1" stroke-width="1"/><text x="640" y="423.0" text-anchor="middle" font-family="Inter,Segoe UI,-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#ECECF1">Container image</text><text x="640" y="442.0" text-anchor="middle" font-family="JetBrains Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="10.5" fill="#6E6E80" letter-spacing="0.6">multi-stage build</text></g>
    <line x1="417" y1="426" x2="453" y2="426" stroke="#3A3A47" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowN)"/>
    <g><rect x="866.6666666666666" y="394" width="357.3333333333333" height="64" rx="10" fill="#1E1533" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1"/><text x="1045" y="423.0" text-anchor="middle" font-family="Inter,Segoe UI,-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#C4B5FD">Azure</text><text x="1045" y="442.0" text-anchor="middle" font-family="JetBrains Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="10.5" fill="#6E6E80" letter-spacing="0.6">container apps</text></g>
    <line x1="823" y1="426" x2="859" y2="426" stroke="#3A3A47" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowN)"/>
