<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 514" width="1280" height="514" role="img" aria-label="How I build: request path from browser or Blazor through ASP.NET Core to EF Core and SQL Server, with Redis as a cache aside the application. Delivery: GitHub Actions builds, tests and scans, producing a container image deployed to Azure Container Apps.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#26262F" stroke-width="1" opacity="0.55"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.65">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#A78BFA" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardclip">
      <rect x="0" y="0" width="1280" height="514" rx="20"/>
    </clipPath>
    <marker id="arrowN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3A3A47"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A78BFA"/></marker>
  </defs>
