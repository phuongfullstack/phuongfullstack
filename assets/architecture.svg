    <g><rect x="56.0" y="148" width="256.0" height="64" rx="10" fill="#16161D" stroke="#3A3A47" stroke-opacity="1" stroke-width="1"/><text x="184" y="177.0" text-anchor="middle" font-family="Inter,Segoe UI,-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#ECECF1">Browser / Blazor</text><text x="184" y="196.0" text-anchor="middle" font-family="JetBrains Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="10.5" fill="#6E6E80" letter-spacing="0.6">razor components</text></g>
    <g><rect x="360.0" y="148" width="256.0" height="64" rx="10" fill="#1E1533" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1"/><text x="488" y="177.0" text-anchor="middle" font-family="Inter,Segoe UI,-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#C4B5FD">ASP.NET Core</text><text x="488" y="196.0" text-anchor="middle" font-family="JetBrains Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="10.5" fill="#6E6E80" letter-spacing="0.6">middleware · endpoints</text></g>
    <line x1="316" y1="180" x2="352" y2="180" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrowA)"/>
    <g><rect x="664.0" y="148" width="256.0" height="64" rx="10" fill="#16161D" stroke="#3A3A47" stroke-opacity="1" stroke-width="1"/><text x="792" y="177.0" text-anchor="middle" font-family="Inter,Segoe UI,-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#ECECF1">EF Core</text><text x="792" y="196.0" text-anchor="middle" font-family="JetBrains Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="10.5" fill="#6E6E80" letter-spacing="0.6">compiled queries</text></g>
    <line x1="620" y1="180" x2="656" y2="180" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrowA)"/>
    <g><rect x="968.0" y="148" width="256.0" height="64" rx="10" fill="#16161D" stroke="#3A3A47" stroke-opacity="1" stroke-width="1"/><text x="1096" y="177.0" text-anchor="middle" font-family="Inter,Segoe UI,-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#ECECF1">SQL Server</text><text x="1096" y="196.0" text-anchor="middle" font-family="JetBrains Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="10.5" fill="#6E6E80" letter-spacing="0.6">indexed · pooled</text></g>
    <line x1="924" y1="180" x2="960" y2="180" stroke="#3A3A47" stroke-width="1.5" marker-end="url(#arrowN)"/>
