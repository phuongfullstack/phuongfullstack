<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="Request path: Angular SPA to ASP.NET Core to EF Core to SQL Server, with Redis cache-aside and RabbitMQ workers alongside the application. Delivery: GitHub Actions builds, tests and scans into a container image deployed to Azure Container Apps with Terraform.">
  <style>
    svg { --bg:#FFFFFF; --border:#E6E4DE; --border-strong:#CFCCC4; --text:#111111; --text-muted:#56534D; --text-faint:#8C887F; --accent:#5B2BD9; }
    @media (prefers-color-scheme: dark) { svg { --bg:#0E0E11; --border:#2A2A30; --border-strong:#3D3D45; --text:#F2F1EE; --text-muted:#A3A099; --text-faint:#736F68; --accent:#A78BFA; } }
    .bg   { fill: var(--bg); }
    .ink  { fill: var(--text); }
    .mut  { fill: var(--text-muted); }
    .fai  { fill: var(--text-faint); }
    .acc  { fill: var(--accent); }
    .hair { stroke: var(--border); stroke-width: 1; fill: none; }
    .edge { stroke: var(--border-strong); stroke-width: 1; fill: none; }
    .accs { stroke: var(--accent); stroke-width: 1.5; fill: none; }
    .serif { font-family: ui-serif,Georgia,Iowan Old Style,Palatino Linotype,Times New Roman,serif; }
    .sans  { font-family: Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif; }
    .mono  { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace; }
    .lbl  { font-size: 11px; font-weight: 600; letter-spacing: 2.4px; }
  </style>
  <defs>
    <marker id="aN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--border-strong)"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--accent)"/></marker>
  </defs>
  <rect class="bg" width="1280" height="460"/>
    <text class="mono lbl fai" x="64" y="40">REQUEST PATH</text>
    <line class="hair" x1="64" y1="58" x2="1216" y2="58"/>
    <g><rect class="edge" x="64.0" y="106" width="258.0" height="60"/><text class="sans ink" x="193" y="134.0" text-anchor="middle" font-size="14" font-weight="600">Angular SPA</text><text class="mono fai" x="193" y="153.0" text-anchor="middle" font-size="10.5">typescript</text></g>
    <g><rect class="accs" x="362.0" y="106" width="258.0" height="60"/><text class="sans acc" x="491" y="134.0" text-anchor="middle" font-size="14" font-weight="600">ASP.NET Core</text><text class="mono fai" x="491" y="153.0" text-anchor="middle" font-size="10.5">middleware · endpoints</text></g>
    <line class="accs" x1="324" y1="136" x2="356" y2="136" marker-end="url(#aA)"/>
    <g><rect class="edge" x="660.0" y="106" width="258.0" height="60"/><text class="sans ink" x="789" y="134.0" text-anchor="middle" font-size="14" font-weight="600">EF Core</text><text class="mono fai" x="789" y="153.0" text-anchor="middle" font-size="10.5">compiled queries</text></g>
    <line class="accs" x1="622" y1="136" x2="654" y2="136" marker-end="url(#aA)"/>
    <g><rect class="edge" x="958.0" y="106" width="258.0" height="60"/><text class="sans ink" x="1087" y="134.0" text-anchor="middle" font-size="14" font-weight="600">SQL Server</text><text class="mono fai" x="1087" y="153.0" text-anchor="middle" font-size="10.5">indexed · pooled</text></g>
    <line class="edge" x1="920" y1="136" x2="952" y2="136" marker-end="url(#aN)"/>
    <g><rect class="edge" x="362.0" y="210" width="258.0" height="54"/><text class="sans ink" x="491" y="235.0" text-anchor="middle" font-size="14" font-weight="600">Redis</text><text class="mono fai" x="491" y="254.0" text-anchor="middle" font-size="10.5">cache-aside</text></g>
    <line class="accs" x1="491" y1="170" x2="491" y2="204" marker-end="url(#aA)" marker-start="url(#aA)"/>
    <g><rect class="edge" x="660.0" y="210" width="258.0" height="54"/><text class="sans ink" x="789" y="235.0" text-anchor="middle" font-size="14" font-weight="600">RabbitMQ</text><text class="mono fai" x="789" y="254.0" text-anchor="middle" font-size="10.5">workers · batch jobs</text></g>
    <line class="edge" x1="789" y1="170" x2="789" y2="204" marker-end="url(#aN)"/>
    <text class="mono lbl fai" x="64" y="306">DELIVERY</text>
    <line class="hair" x1="64" y1="324" x2="1216" y2="324"/>
    <g><rect class="edge" x="64.0" y="336" width="357.3333333333333" height="60"/><text class="sans ink" x="243" y="364.0" text-anchor="middle" font-size="14" font-weight="600">GitHub Actions</text><text class="mono fai" x="243" y="383.0" text-anchor="middle" font-size="10.5">build · test · scan</text></g>
    <g><rect class="edge" x="461.3333333333333" y="336" width="357.3333333333333" height="60"/><text class="sans ink" x="640" y="364.0" text-anchor="middle" font-size="14" font-weight="600">Container image</text><text class="mono fai" x="640" y="383.0" text-anchor="middle" font-size="10.5">multi-stage build</text></g>
    <line class="edge" x1="423" y1="366" x2="455" y2="366" stroke-dasharray="4 4" marker-end="url(#aN)"/>
    <g><rect class="accs" x="858.6666666666666" y="336" width="357.3333333333333" height="60"/><text class="sans acc" x="1037" y="364.0" text-anchor="middle" font-size="14" font-weight="600">Azure</text><text class="mono fai" x="1037" y="383.0" text-anchor="middle" font-size="10.5">container apps · terraform</text></g>
    <line class="edge" x1="821" y1="366" x2="853" y2="366" stroke-dasharray="4 4" marker-end="url(#aN)"/>
</svg>
